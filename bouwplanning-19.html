<style>
:root {
  --bg:#111111;--surface:#1e1e1e;--surface2:#282828;--border:#444444;
  --accent:#ffb830;--accent2:#ff6a3d;--text:#ffffff;--muted:#aaaaaa;
  --green:#5dbb61;--yellow:#ffb830;--red:#ff5733;--blue:#5eaaff;--purple:#b89dff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;}
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.1rem;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
.sync-status{font-size:0.75rem;display:flex;align-items:center;gap:5px;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);}
.sync-dot.live{background:var(--green);box-shadow:0 0 6px var(--green);}
.sync-dot.error{background:var(--red);}
#naam-scherm{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#naam-scherm h2{color:var(--accent);font-size:1.2rem;margin-bottom:8px;letter-spacing:2px;}
#naam-scherm p{color:var(--muted);font-size:0.85rem;margin-bottom:20px;text-align:center;}
#naam-input{background:var(--surface);border:2px solid var(--accent);color:var(--text);font-family:inherit;font-size:1rem;padding:12px 16px;border-radius:6px;width:100%;max-width:300px;margin-bottom:12px;text-align:center;}
#naam-input:focus{outline:none;}
.btn-primary{background:var(--accent);color:#000;font-family:inherit;font-weight:bold;font-size:1rem;padding:12px 24px;border:none;border-radius:6px;cursor:pointer;width:100%;max-width:300px;}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 16px;font-size:0.85rem;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}
nav{display:flex;overflow-x:auto;background:var(--surface2);border-bottom:1px solid var(--border);scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{flex:0 0 auto;padding:10px 14px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:0.85rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:1px;}
nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none;padding:12px;}
.tab-content.active{display:block;}
.dag-header{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 14px;margin-bottom:12px;border-radius:0 6px 6px 0;}
.dag-header h2{font-size:1.05rem;color:var(--accent);letter-spacing:1px;text-transform:uppercase;}
.dag-header p{font-size:0.82rem;color:var(--muted);margin-top:4px;}
.taak-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:13px 14px;margin-bottom:10px;}
.taak-item.done{border-left:4px solid var(--green);}
.taak-top{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.taak-nr{background:var(--accent);color:#000;font-weight:bold;font-size:0.82rem;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:3px;flex-shrink:0;}
.taak-item.done .taak-nr{background:var(--green);}
.taak-item.done .taak-wat{text-decoration:line-through;color:var(--muted);}
.taak-tekst{flex:1;}
.taak-wat{font-size:0.95rem;}
.taak-locatie{font-size:0.82rem;color:var(--blue);margin-top:4px;}
.taak-wie{font-size:0.82rem;color:var(--yellow);margin-top:3px;}
.gedaan-door{font-size:0.75rem;color:var(--green);margin-top:3px;}
.notitie-teller{font-size:0.75rem;color:var(--muted);margin-top:3px;}
.check-icon{font-size:1.5rem;flex-shrink:0;}
.taak-acties{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.taak-acties button{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-family:inherit;font-size:0.82rem;padding:8px;border-radius:4px;cursor:pointer;font-weight:bold;}
.taak-acties button.foto-btn{flex:0 0 auto;padding:8px 14px;}
.taak-notities{display:none;margin-top:10px;}
.taak-item.open .taak-notities{display:block;}
.notitie-item{font-size:0.82rem;padding:8px 10px;background:var(--surface2);border-radius:4px;margin-bottom:6px;}
.notitie-meta{font-size:0.75rem;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
.notitie-del{background:none;border:none;color:var(--red);font-size:0.9rem;cursor:pointer;padding:0 2px;}
.notitie-invoer{display:flex;gap:6px;margin-top:8px;}
.notitie-invoer input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:0.85rem;padding:8px 10px;border-radius:4px;}
.notitie-invoer input:focus{outline:none;border-color:var(--accent);}
.notitie-invoer button{background:var(--accent);color:#000;border:none;font-family:inherit;font-size:0.85rem;font-weight:bold;padding:8px 12px;border-radius:4px;cursor:pointer;}
.persoon-kaart{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.persoon-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.persoon-naam{font-size:0.95rem;font-weight:bold;}
.diensten-count{font-size:0.78rem;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:10px;}
.persoon-shifts{display:none;padding:0 14px 12px;border-top:1px solid var(--border);}
.persoon-shifts.open{display:block;}
.shift-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
.shift-row:last-child{border-bottom:none;}
.shift-dag{min-width:95px;color:var(--muted);}
.shift-tijd{color:var(--accent);font-weight:bold;}
.locatie-kaart{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.locatie-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.locatie-naam{font-size:0.95rem;color:var(--accent);font-weight:bold;}
.locatie-body{padding:10px 14px;}
.locatie-row{display:flex;font-size:0.85rem;padding:5px 0;border-bottom:1px solid var(--border);gap:8px;}
.locatie-row:last-child{border-bottom:none;}
.locatie-label{color:var(--muted);min-width:80px;flex-shrink:0;}
.badge{font-size:0.75rem;padding:3px 8px;border-radius:3px;font-weight:bold;}
.badge-bouw{background:var(--accent2);color:#fff;}
.badge-leverancier{background:#444;color:var(--text);}
.hek-kaart{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;cursor:pointer;}
.section-title{font-size:0.78rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px;border-bottom:1px solid var(--border);padding-bottom:5px;}
.dag-btn-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.dag-btn-row::-webkit-scrollbar{display:none;}
.dag-btn{flex:0 0 auto;background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:7px 14px;border-radius:4px;font-family:inherit;font-size:0.82rem;cursor:pointer;}
.dag-btn.active{background:var(--accent);color:#000;border:none;font-weight:bold;}
.nt-kaart{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;padding:12px 14px;}

.nt-auteur{font-size:0.75rem;color:var(--muted);}
.nt-status{font-size:0.72rem;padding:2px 8px;border-radius:3px;}
</style>

<!-- Firebase module: alleen imports en database verbinding -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBM1GVbghAAHc6qmCiaX1pVJ9MumDBAXsE",
  authDomain: "bouwploeg-app.firebaseapp.com",
  projectId: "bouwploeg-app",
  storageBucket: "bouwploeg-app.firebasestorage.app",
  messagingSenderId: "734833746699",
  appId: "1:734833746699:web:ff36159a983570e292380e",
  databaseURL: "https://bouwploeg-app-default-rtdb.europe-west1.firebasedatabase.app"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

function setSyncStatus(s) {
  var dot = document.getElementById('sync-dot');
  var lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot ' + s;
  lbl.textContent = s==='live' ? 'live sync' : s==='error' ? 'geen verbinding' : 'verbinden...';
  lbl.style.color = s==='live' ? 'var(--green)' : s==='error' ? 'var(--red)' : 'var(--muted)';
}

onValue(ref(db,'taken'), function(snap) {
  setSyncStatus('live');
  window._taakStatus = snap.val() || {};
  if (window.renderDag) window.renderDag();
}, function() { setSyncStatus('error'); });

// Luister naar planning updates van admin
onValue(ref(db,'planning'), function(snap) {
  var data = snap.val();
  if (!data) return;
  if (data.dagData)   window._fbDagData   = data.dagData;
  if (data.bezetting) window._fbBezetting = data.bezetting;
  if (data.locaties)  window._fbLocaties  = data.locaties;
  if (data.bijgewerkt) window._fbBijgewerkt = data.bijgewerkt;
  if (window.renderDag)       window.renderDag();
  if (window.renderBezetting) window.renderBezetting();
  if (window.renderLocaties)  window.renderLocaties();
  if (window.toonBijgewerkt)  window.toonBijgewerkt(data.bijgewerkt);
});

onValue(ref(db,'notities'), function(snap) {
  window._notities = snap.val() || {};
  if (window.renderDag) window.renderDag();
  if (window.renderNotitiesOverzicht) window.renderNotitiesOverzicht();
});

window.dbSet    = function(path, data) { set(ref(db, path), data); };
window.dbPush   = function(path, data) { push(ref(db, path), data); };
window.dbRemove = function(path)       { remove(ref(db, path)); };
</script>

document.getElementById('naam-btn').addEventListener('click', function() {
  var val = document.getElementById('naam-input').value.trim();
  if (!val) return;
  localStorage.setItem('br26_naam', val);
  document.getElementById('naam-scherm').style.display = 'none';
});

  if (e.key === 'Enter') document.getElementById('naam-btn').click();
});
if (localStorage.getItem('br26_naam')) {
  document.getElementById('naam-scherm').style.display = 'none';
}

function toonToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

  document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('nav button').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('tab-' + tabId).classList.add('active');
  document.getElementById('nav-' + tabId).classList.add('active');
  if (tabId === 'notities') renderNotitiesOverzicht();
}

// ── HELPERS ────────────────────────────────────────
function toonBijgewerkt(iso) {
  if (!iso) return;
  var el = document.getElementById('bijgewerkt-label');
  if (!el) return;
  var d = new Date(iso);
  el.textContent = 'Planning: ' + d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  el.style.display = 'block';
}
window.toonBijgewerkt = toonBijgewerkt;

function tijdGeleden(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'zojuist';
  if (diff < 60) return diff + 'm geleden';
  return Math.floor(diff/60) + 'u geleden';
}

// ── DAG KNOPPEN ────────────────────────────────────
var dagBtnsEl = document.getElementById('dag-btns');
Object.keys(dagLabels).forEach(function(key) {
  var b = document.createElement('button');
  b.className = 'dag-btn' + (key === huidigeDag ? ' active' : '');
  b.textContent = dagLabels[key];
  b.onclick = function() {
    document.querySelectorAll('.dag-btn').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    huidigeDag = key;
    openTaken = {};
    renderDag();
  };
  dagBtnsEl.appendChild(b);
});

// ── DAGPLANNING ────────────────────────────────────
function renderDag() {
  var bronData = window._fbDagData || dagData;
  var d = bronData[huidigeDag];
  if (!d) d = dagData[huidigeDag];
  var container = document.getElementById('dag-inhoud');
  var ts = window._taakStatus || {};
  var nt = window._notities || {};
  var gedaan = d.taken.filter(function(x,i){ return ts[huidigeDag+'-'+i] && ts[huidigeDag+'-'+i].done; }).length;

  var html = '<div class="dag-header"><h2>' + d.label + '</h2><p>Tijd: ' + d.tijd + ' &nbsp;|&nbsp; Gedaan: ' + gedaan + '/' + d.taken.length + '</p></div>';

  d.taken.forEach(function(taak, i) {
    var key = huidigeDag + '-' + i;
    var status = ts[key] || {};
    var done = !!status.done;
    var isOpen = !!openTaken[key];
    var taakNts = nt[key] ? Object.values(nt[key]) : [];

    html += '<div class="taak-item' + (done?' done':'') + (isOpen?' open':'') + '">';

    // Bovenste rij: nummer + tekst + vinkje
    html += '<div class="taak-top" onclick="vinkAf(\'' + key + '\')">';
    html += '<div class="taak-nr">' + (i+1) + '</div>';
    html += '<div class="taak-tekst">';
    html += '<div class="taak-wat">' + taak.wat + '</div>';
    if (taak.locatie) html += '<div class="taak-locatie">&#128205; ' + taak.locatie + '</div>';
    if (taak.wie)     html += '<div class="taak-wie">&#128100; ' + taak.wie + '</div>';
    if (done)         html += '<div class="gedaan-door">&#10003; ' + (status.door||'?') + ' (' + tijdGeleden(status.ts) + ')</div>';
    if (taakNts.length > 0) html += '<div class="notitie-teller">&#128172; ' + taakNts.length + ' notitie(s)</div>';
    html += '</div>';
    html += '<div class="check-icon">' + (done ? '&#9989;' : '&#9634;') + '</div>';
    html += '</div>';

    // Actie knoppen
    html += '<div class="taak-acties">';
    var ntLabel = taakNts.length > 0 ? '&#128172; ' + taakNts.length + ' notitie(s)' : '&#128172; Notitie';
    var ntStyle = taakNts.length > 0 ? ' style="color:var(--accent);border-color:var(--accent);font-weight:bold;"' : '';
    html += '<button onclick="toggleOpen(\'' + key + '\')"' + ntStyle + '>' + ntLabel + '</button>';
    html += '<button class="foto-btn" onclick="fotoToevoegen(\'' + key + '\')">&#128247; Foto</button>';
    html += '</div>';

    // Notities sectie
    html += '<div class="taak-notities">';
    if (taakNts.length === 0) {
      html += '<div style="font-size:0.82rem;color:var(--muted);padding:6px 0;">Nog geen notities</div>';
    }
    taakNts.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(n) {
      var nKey = Object.keys(nt[key]||{}).find(function(k){ return (nt[key]||{})[k] === n; }) || '';
      var isEigen = n.door === getNaam();
      html += '<div class="notitie-item">';
      html += '<div class="notitie-meta"><span>' + n.door + ' &mdash; ' + tijdGeleden(n.ts) + '</span>';
      if (isEigen && nKey) html += '<button class="notitie-del" onclick="verwijderNotitie(\'' + key + '\',\'' + nKey + '\')">&#10005;</button>';
      html += '</div>';
      if (n.foto) {
        html += '<img src="' + n.foto + '" style="width:100%;border-radius:4px;margin-top:4px;">';
      } else {
        html += '<div>' + n.tekst + '</div>';
      }
      html += '</div>';
    });
    html += '<div class="notitie-invoer">';
    html += '<input type="text" id="ni-' + key + '" placeholder="Notitie typen..." maxlength="200" onkeydown="if(event.key===\'Enter\')plaatsNotitie(\'' + key + '\')">';
    html += '<button onclick="plaatsNotitie(\'' + key + '\')">+</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}
window.renderDag = renderDag;

function vinkAf(key) {
  var ts = window._taakStatus || {};
  var newDone = !(ts[key] && ts[key].done);
  if (window.dbSet) window.dbSet('taken/' + key, {done:newDone, door:getNaam(), ts:Date.now()});
  var idx = parseInt(key.split('-').pop());
  var bronData2 = window._fbDagData || dagData; var naam = bronData2[huidigeDag] && bronData2[huidigeDag].taken[idx] ? bronData2[huidigeDag].taken[idx].wat : key;
  toonToast((newDone ? '&#10003; Gedaan: ' : '&#8617; Ongedaan: ') + getNaam() + ' - ' + naam.substring(0,35));
}

function toggleOpen(key) {
  openTaken[key] = !openTaken[key];
  renderDag();
}

function plaatsNotitie(key) {
  var input = document.getElementById('ni-' + key);
  if (!input) return;
  var tekst = input.value.trim();
  if (!tekst) return;
  if (window.dbPush) window.dbPush('notities/' + key, {tekst:tekst, door:getNaam(), ts:Date.now()});
  input.value = '';
  toonToast('Notitie geplaatst');
}

function verwijderNotitie(taakKey, nKey) {
  if (!confirm('Verwijderen?')) return;
  if (window.dbRemove) window.dbRemove('notities/' + taakKey + '/' + nKey);
  toonToast('Verwijderd');
}

function fotoToevoegen(key) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = function() {
    var file = input.files[0];
    if (!file) return;
    toonToast('Foto wordt verkleind...');
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxSize = 1200;
        var w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = Math.round(h*maxSize/w); w = maxSize; } }
        else        { if (h > maxSize) { w = Math.round(w*maxSize/h); h = maxSize; } }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var base64 = canvas.toDataURL('image/jpeg', 0.7);
        var kb = Math.round(base64.length * 0.75 / 1024);
        if (window.dbPush) window.dbPush('notities/' + key, {tekst:'[foto]', foto:base64, door:getNaam(), ts:Date.now()});
        toonToast('Foto geplaatst (' + kb + ' KB)');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ── NOTITIES OVERZICHT ─────────────────────────────
function renderNotitiesOverzicht() {
  var container = document.getElementById('notities-overzicht');
  if (!container) return;
  var nt = window._notities || {};
  var ts = window._taakStatus || {};
  var alle = [];

  Object.keys(nt).forEach(function(taakKey) {
    var dashIdx = taakKey.lastIndexOf('-');
    var dagKey  = taakKey.substring(0, dashIdx);
    var taakIdx = parseInt(taakKey.substring(dashIdx+1));
    var dag = (window._fbDagData || dagData)[dagKey];
    var taak    = dag && dag.taken[taakIdx] ? dag.taken[taakIdx] : null;
    var dagLabel = dag ? dag.label : dagKey;
    var taakNaam = taak ? taak.wat : taakKey;
    var locatie  = taak ? taak.locatie : '';
    var wie      = taak ? taak.wie : '';
    var gedaan   = ts[taakKey] && ts[taakKey].done;

    Object.keys(nt[taakKey]).forEach(function(nKey) {
      var n = nt[taakKey][nKey];
      alle.push({
        taakKey: taakKey, nKey: nKey,
        dagLabel: dagLabel, taakNaam: taakNaam,
        locatie: locatie, wie: wie,
        door: n.door, tekst: n.tekst, foto: n.foto,
        ts: n.ts, gedaan: gedaan
      });
    });
  });

  alle.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

  // Update badge in nav
  var badge = document.getElementById('notitie-badge');
  if (badge) {
    if (alle.length > 0) {
      badge.textContent = alle.length;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }
  }

  if (alle.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;font-size:0.9rem;">Nog geen notities geplaatst</div>';
    return;
  }

  var html = '<div class="section-title">' + alle.length + ' notities totaal</div>';

  alle.forEach(function(n, idx) {
    var isEigen = n.door === getNaam();
    var openId  = 'nt-open-' + idx;

    html += '<div class="nt-kaart" onclick="toggleNtOpen(\'' + openId + '\')" style="cursor:pointer;">';

    // Dag + taaknaam
    html += '<div class="nt-dag">' + n.dagLabel + '</div>';
    html += '<div class="nt-taak">' + n.taakNaam + '</div>';

    // Locatie — altijd tonen als beschikbaar
    if (n.locatie) {
      html += '<div style="font-size:0.8rem;color:var(--blue);margin-bottom:6px;">&#128205; ' + n.locatie + '</div>';
    }

    // Meta: auteur + status
    html += '<div class="nt-meta">';
    html += '<span class="nt-auteur">&#128172; ' + n.door + ' &mdash; ' + tijdGeleden(n.ts) + '</span>';
    html += '<span class="nt-status" style="background:' + (n.gedaan?'var(--green)':'var(--surface2)') + ';color:' + (n.gedaan?'#000':'var(--muted)') + ';padding:2px 8px;border-radius:3px;font-size:0.75rem;">' + (n.gedaan?'&#10003; Gedaan':'Open') + '</span>';
    html += '</div>';

    // Preview
    if (n.foto) {
      html += '<div style="font-size:0.8rem;color:var(--muted);margin-top:4px;">&#128247; Foto &mdash; tik om te openen</div>';
    } else {
      html += '<div style="font-size:0.85rem;color:var(--text);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + n.tekst + '</div>';
    }

    // Uitklapbaar detail
    html += '<div id="' + openId + '" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);" onclick="event.stopPropagation()">';
    if (n.foto) {
      html += '<img src="' + n.foto + '" style="width:100%;border-radius:4px;">';
    } else {
      html += '<div class="nt-inhoud" style="white-space:pre-wrap;">' + n.tekst + '</div>';
    }
    if (n.wie) html += '<div style="font-size:0.8rem;color:var(--yellow);margin-top:6px;">&#128100; ' + n.wie + '</div>';
    if (isEigen) {
      html += '<div style="margin-top:10px;text-align:right;">';
      html += '<button onclick="event.stopPropagation();verwijderNotitie(\'' + n.taakKey + '\',\'' + n.nKey + '\')" style="background:none;border:1px solid var(--red);color:var(--red);font-family:inherit;font-size:0.82rem;padding:5px 14px;border-radius:4px;cursor:pointer;">Verwijderen</button>';
      html += '</div>';
    }
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

function toggleNtOpen(id) {
  var el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function updateNotitieBadge() {
  var nt = window._notities || {};
  var totaal = 0;
  Object.keys(nt).forEach(function(k){ totaal += Object.keys(nt[k]).length; });
  var badge = document.getElementById('notitie-badge');
  if (!badge) return;
  if (totaal > 0) { badge.textContent = totaal; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }
}
window.updateNotitieBadge = updateNotitieBadge;
window.renderNotitiesOverzicht = renderNotitiesOverzicht;

// ── BEZETTING ──────────────────────────────────────
function renderBezetting() {
  var container = document.getElementById('bezetting-inhoud');
  var bron = window._fbBezetting || bezettingData;
  var html = '<div class="section-title">' + bron.length + ' medewerkers</div>';
  bron.forEach(function(p) {
    html += '<div class="persoon-kaart">';
    html += '<div class="persoon-header" onclick="this.nextElementSibling.classList.toggle(\'open\')">';
    html += '<span class="persoon-naam">&#128119; ' + p.naam + '</span>';
    html += '<span class="diensten-count">' + p.shifts.length + ' diensten</span>';
    html += '</div>';
    html += '<div class="persoon-shifts">';
    p.shifts.forEach(function(s) {
      html += '<div class="shift-row"><span class="shift-dag">' + s.dag + '</span><span class="shift-tijd">' + s.tijd + '</span></div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// ── LOCATIES ───────────────────────────────────────
function renderLocaties() {
  var container = document.getElementById('locaties-inhoud');
  var bron = window._fbLocaties || locatiesData;
  var html = '<div class="section-title">Leveranciers en bouwschema</div>';
  bron.forEach(function(loc) {
    html += '<div class="locatie-kaart">';
    html += '<div class="locatie-header"><span class="locatie-naam">&#128205; ' + loc.naam + '</span><span class="badge badge-leverancier">' + loc.leverancier + '</span></div>';
    html += '<div class="locatie-body">';
    html += '<div class="locatie-row"><span class="locatie-label">Bouwdag:</span><span><span class="badge badge-bouw">' + loc.bouwdag + '</span></span></div>';
    if (loc.tijd) html += '<div class="locatie-row"><span class="locatie-label">Aankomst:</span><span style="color:var(--accent);font-weight:bold;">' + loc.tijd + '</span></div>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// ── HEKWERK ────────────────────────────────────────
function toggleHek(idx) {
  var el = document.getElementById('hd-' + idx);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderHekwerk() {
  var container = document.getElementById('hekwerk-inhoud');
  var tB  = hekwerkData.reduce(function(a,h){return a+h.bouwhek;},0);
  var tD  = hekwerkData.reduce(function(a,h){return a+h.dranghek;},0);
  var tBa = hekwerkData.reduce(function(a,h){return a+h.barrier;},0);
  var tP  = hekwerkData.reduce(function(a,h){return a+h.politiebarrier;},0);
  var tF  = hekwerkData.reduce(function(a,h){return a+h.fietsenrek;},0);
  var bkB = hekwerkData.reduce(function(a,h){return a+h.bokken.bouwhek;},0);
  var bkD = hekwerkData.reduce(function(a,h){return a+h.bokken.dranghek;},0);
  var bkBa= hekwerkData.reduce(function(a,h){return a+h.bokken.barrier;},0);
  var bkP = hekwerkData.reduce(function(a,h){return a+h.bokken.politiebarrier;},0);

  var html = '<div class="section-title">Totaal alle locaties</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">';
  html += totaalKaart('BOUWHEKKEN', tB, bkB + ' bok(ken)', 'var(--accent)');
  html += totaalKaart('DRANGHEKKEN', tD, bkD + ' bok(ken)', 'var(--blue)');
  html += totaalKaart('BARRIERS', tBa, bkBa + ' bok(ken)', 'var(--purple)');
  html += totaalKaart('POLITIEBARRIERS', tP, bkP + ' bok(ken)', 'var(--red)');
  html += '<div style="grid-column:1/-1;">' + totaalKaart('FIETSENREKKEN', tF, '', 'var(--yellow)') + '</div>';
  html += '</div>';
  html += '<div class="section-title">Per locatie (tik om te openen)</div>';

  hekwerkData.forEach(function(h, i) {
    html += '<div class="hek-kaart" onclick="toggleHek(' + i + ')">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;">';
    html += '<div><div style="font-size:0.78rem;color:var(--muted);">Locatie ' + h.nr + '</div><div style="font-size:0.92rem;font-weight:bold;">' + h.waar + '</div></div>';
    html += '<div style="text-align:right;font-size:0.82rem;">';
    html += '<div style="color:var(--accent);">' + h.bouwhek + ' bouw</div>';
    html += '<div style="color:var(--blue);">' + h.dranghek + ' drang</div>';
    if (h.politiebarrier > 0) html += '<div style="color:var(--red);">' + h.politiebarrier + ' politie</div>';
    html += '</div></div>';
    html += '<div id="hd-' + i + '" style="display:none;border-top:1px solid var(--border);padding:12px 14px;">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;">';
    html += '<tr><td style="color:var(--muted);padding:4px 0;">Bouwhekken</td><td style="color:var(--accent);text-align:right;">' + h.bouwhek + ' <span style="color:var(--muted);font-size:0.75rem;">(+' + h.opzet + ' opzet)</span></td></tr>';
    html += '<tr><td style="color:var(--muted);padding:4px 0;">Dranghekken</td><td style="color:var(--blue);text-align:right;">' + h.dranghek + '</td></tr>';
    html += '<tr><td style="color:var(--muted);padding:4px 0;">Barriers</td><td style="color:var(--purple);text-align:right;">' + h.barrier + '</td></tr>';
    html += '<tr><td style="color:var(--muted);padding:4px 0;">Politiebarriers</td><td style="color:var(--red);text-align:right;">' + h.politiebarrier + '</td></tr>';
    html += '<tr><td style="color:var(--muted);padding:4px 0;">Fietsenrekken</td><td style="color:var(--yellow);text-align:right;">' + h.fietsenrek + '</td></tr>';
    html += '</table>';
    var bkTot = h.bokken.bouwhek+h.bokken.dranghek+h.bokken.barrier+h.bokken.politiebarrier;
    if (bkTot > 0) {
      html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--muted);">Bokken: ';
      if(h.bokken.bouwhek>0)      html += h.bokken.bouwhek+'x bouw ';
      if(h.bokken.dranghek>0)     html += h.bokken.dranghek+'x drang ';
      if(h.bokken.barrier>0)      html += h.bokken.barrier+'x barrier ';
      if(h.bokken.politiebarrier>0) html += h.bokken.politiebarrier+'x politie';
      html += '</div>';
    }
    if (h.opmerking) html += '<div style="margin-top:8px;font-size:0.82rem;color:var(--yellow);">&#9889; ' + h.opmerking + '</div>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function totaalKaart(label, getal, sub, kleur) {
  return '<div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid '+kleur+';border-radius:4px;padding:10px 12px;">' +
    '<div style="font-size:0.75rem;color:var(--muted);">' + label + '</div>' +
    '<div style="font-size:1.5rem;font-weight:bold;color:'+kleur+';">' + getal + '</div>' +
    (sub ? '<div style="font-size:0.75rem;color:var(--muted);">' + sub + '</div>' : '') +
    '</div>';
}

// ── INIT ───────────────────────────────────────────
renderDag();
renderBezetting();
renderLocaties();
renderHekwerk();
</script>
<script>
// ── SERVICE WORKER ─────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

// ── PWA INSTALL PROMPT ─────────────────────────────
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  var banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'flex';
});

document.getElementById('install-btn').addEventListener('click', function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(result) {
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
});

document.getElementById('install-sluit').addEventListener('click', function() {
  document.getElementById('install-banner').style.display = 'none';
});

window.addEventListener('appinstalled', function() {
  document.getElementById('install-banner').style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
